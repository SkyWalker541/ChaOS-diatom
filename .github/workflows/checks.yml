# Every check, on every push and pull request (2026-11-25).
#
# The desktop build comes first: check-proto and check-stateplane run that
# binary, and skip without it - right for someone who hasn't built yet, wrong
# for CI, where a skip would pass while testing nothing.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev zlib1g-dev

      - name: The desktop build
        run: make -j"$(nproc)"

      - name: make check, nothing skipped
        run: |
          make check 2>&1 | tee check.log
          if grep -q '^  skip' check.log; then echo "a check skipped" >&2; exit 1; fi
